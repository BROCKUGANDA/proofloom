services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/prod.db
      NODE_ENV: production
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:80"
      - "127.0.0.1:8454:443"
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/caddy/certs:/certs:ro
      - proofloom-caddy-data:/data
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  proofloom-caddy-data:
